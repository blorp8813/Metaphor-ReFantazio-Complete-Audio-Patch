; MetaphorCompleteAudioPatch
; Audio fix for Metaphor: ReFantazio on Wine and CrossOver.
;
; Drop this file next to MetaphorCompleteAudioPatch.asi.

[XAudio2]
Enabled = true
ForceStereoMasteringVoice = false
OverrideExplicitMultichannelVoices = false

[WASAPI]
Enabled = true
ForceStereoMixFormat = false
ForceStereoIsFormatSupported = false
ForceStereoInitialize = false
DisableSpatialAudioClient = false
RejectMultichannelIsFormatSupported = false
RejectMultichannelInitialize = false

[Spatial]
WrapperEnabled = true

[Diagnostics]
; Full telemetry is opt-in. Recovery events can still be logged separately below.
Enabled = false
; Empty or relative paths are resolved beside METAPHOR.exe / the ASI plugin.
LogPath = MetaphorCompleteAudioPatch.log
MaxLogSizeMB = 16
MaxLogFiles = 3
StallTimeoutMs = 2000
WatchdogPollIntervalMs = 250
NonSilentWindowMs = 750
BufferActivityWindowMs = 750
PeriodicStatusMs = 1000
DetailedBufferLogging = false
BufferLogSampleRate = 100
ErrorReminderMs = 30000

[Recovery]
; Production default: one bounded adaptive retry, without stream reset or recreation.
Enabled = true
RecoveryLogging = true
AdaptiveBufferRetry = true
ResetRestartFallback = false
RecreateClientFallback = false
MaximumAttemptsPerFailure = 1
MaximumRecoveriesPerWindow = 3
RecoveryWindowMs = 30000
RecoveryCooldownMs = 1000
FaultInjectBufferTooLargeAfter = 0

[Bootstrap]
ModulePollTimeoutMs = 120000
ModulePollIntervalMs = 250
