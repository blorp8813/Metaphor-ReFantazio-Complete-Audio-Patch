name: Complete Audio Patch release artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version such as v0.2.0-rc.1
        required: true
        default: v0.2.0-rc.1
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 zip
      - name: Resolve explicit version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi
          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - name: Run portable tests
        run: ./tests/run-host-tests.sh
      - name: Verify production configuration and licenses
        run: ./scripts/verify-release-config.sh
      - name: Build Windows x86-64 package
        run: ./build-windows.sh
      - name: Package deterministic release artifact
        run: ./scripts/package-release.sh "${{ steps.version.outputs.value }}"
      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metaphor-ReFantazio-Complete-Audio-Patch-${{ steps.version.outputs.value }}-win64
          path: |
            dist/Metaphor-ReFantazio-Complete-Audio-Patch-${{ steps.version.outputs.value }}-win64.zip
            dist/Metaphor-ReFantazio-Complete-Audio-Patch-${{ steps.version.outputs.value }}-win64.zip.sha256
          if-no-files-found: error
          retention-days: 30
