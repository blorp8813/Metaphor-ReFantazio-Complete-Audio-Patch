name: Feature request
description: Propose a narrowly scoped compatibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Compatibility problem
      description: Describe the user-visible problem and environment, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction evidence
      description: Include redacted event names or measurements. Do not attach proprietary game files.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and safety limits
    validations:
      required: true
